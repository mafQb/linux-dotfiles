general {
    lock_cmd = pidof hyprlock || hyprlock # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session # Lock the session before suspending
    after_sleep_cmd = hyprctl dispatch dpms on # Turn screen back on after suspend
}

listener {
    timeout = 180 # 5 minutes in seconds
    on-timeout = loginctl lock-session # Lock the screen
}

listener {
    timeout = 210 # 5.5 minutes (30 seconds after lock)
    on-timeout = hyprctl dispatch dpms off # Turn off the screen
    on-resume = hyprctl dispatch dpms on # Turn screen back on on activity
}

listener {
    timeout = 900 # 30 minutes
    on-timeout = systemctl suspend # Suspend the system
}
